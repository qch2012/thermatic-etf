# Daily refresh (SPEC 7). Checks run inside `python -m pipeline`: if one fails, nothing is written,
# the job fails, and the last step opens (or comments on) a GitHub issue. The site then goes stale.
name: refresh
on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, after the US close in both EST and EDT
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: refresh
  cancel-in-progress: false
defaults:
  run:
    shell: bash   # bash -eo pipefail, so `| tee` keeps the pipeline's exit code
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Last-good data per fund (SPEC 4). Saved only when the job succeeds, so a failed run never poisons it.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: last-good-${{ github.run_id }}
          restore-keys: last-good-
      - run: python -m pipeline 2>&1 | tee run.log
      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || { git commit -m "data: daily refresh $(date -u +%F)"; git push; }
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"$'\n\nNothing was published; the site keeps the last data and shows a stale banner after 2 trading days.\n\n```\n'"$(tail -n 30 run.log 2>/dev/null)"$'\n```'
          open=$(gh issue list --state open --search "Daily refresh failed in:title" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Daily refresh failed" --body "$body"; fi
